name: Deploy to EKS

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
          - deploy-helm
          - all
        default: 'plan'
      environment:
        description: 'Environment (dev, staging, prod)'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: 'dev'
      image_tag:
        description: 'Docker image tag to deploy'
        required: false
        type: string
        default: 'latest'
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - 'helm/**'
      - '.github/workflows/deploy-eks.yaml'

env:
  AWS_REGION: us-east-1
  TERRAFORM_DIR: terraform
  HELM_CHART_DIR: helm/meteo-app
  NAMESPACE: meteo
  EKS_CLUSTER_NAME: meteo-cluster-${{ github.event.inputs.environment || 'dev' }}

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.action == 'plan' || 
      github.event.inputs.action == 'all' || 
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[terraform]'))
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform init

      - name: Terraform Plan
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          terraform plan -out=tfplan
        env:
          TF_VAR_environment: ${{ github.event.inputs.environment || 'dev' }}

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TERRAFORM_DIR }}/tfplan

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.event.inputs.action == 'apply' || github.event.inputs.action == 'all'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TERRAFORM_DIR }}

      - name: Terraform Init
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform init

      - name: Terraform Apply
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_environment: ${{ github.event.inputs.environment || 'dev' }}

      - name: Get Cluster Name
        id: cluster
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          # Get cluster name from Terraform outputs
          CLUSTER_NAME=$(terraform output -raw cluster_name 2>/dev/null || echo "")
          
          # Fallback to environment variable if output not available
          if [ -z "$CLUSTER_NAME" ]; then
            CLUSTER_NAME="${{ env.EKS_CLUSTER_NAME }}"
            echo "⚠️  Using cluster name from environment: $CLUSTER_NAME"
          else
            echo "✅ Cluster name from Terraform: $CLUSTER_NAME"
          fi
          
          echo "cluster_name=$CLUSTER_NAME" >> $GITHUB_OUTPUT

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ steps.cluster.outputs.cluster_name }}

      - name: Verify kubectl connection
        run: kubectl cluster-info

  deploy-helm:
    name: Deploy with Helm
    runs-on: ubuntu-latest
    # If action is 'all', wait for terraform-apply. Otherwise, can run independently
    needs: 
      - terraform-apply
    if: |
      always() &&
      (github.event.inputs.action == 'deploy-helm' || 
       github.event.inputs.action == 'all' || 
       (github.event_name == 'push' && contains(github.event.head_commit.message, '[helm]')))
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Get Cluster Info
        id: terraform
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          terraform init
          # Try to get cluster name from Terraform outputs
          CLUSTER_NAME=$(terraform output -raw cluster_name 2>/dev/null || echo "")
          
          # If not found, construct it from environment variable
          if [ -z "$CLUSTER_NAME" ]; then
            CLUSTER_NAME="${{ env.EKS_CLUSTER_NAME }}"
            echo "⚠️  Cluster name not found in Terraform outputs, using: $CLUSTER_NAME"
          fi
          
          # Verify cluster exists
          if ! aws eks describe-cluster --name "$CLUSTER_NAME" --region ${{ env.AWS_REGION }} >/dev/null 2>&1; then
            echo "❌ Error: Cluster '$CLUSTER_NAME' does not exist. Run terraform apply first."
            exit 1
          fi
          
          echo "✅ Cluster found: $CLUSTER_NAME"
          echo "cluster_name=$CLUSTER_NAME" >> $GITHUB_OUTPUT

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ steps.terraform.outputs.cluster_name }}

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.13.0'

      - name: Get AWS Account ID
        id: aws
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=$AWS_ACCOUNT_ID" >> $GITHUB_OUTPUT

      - name: Get ECR Token
        id: ecr
        run: |
          ECR_TOKEN=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})
          echo "::add-mask::$ECR_TOKEN"
          echo "token=$ECR_TOKEN" >> $GITHUB_OUTPUT

      - name: Create ECR Secret
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          
          kubectl create secret docker-registry ecr-registry-secret \
            --docker-server=${{ steps.aws.outputs.account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com \
            --docker-username=AWS \
            --docker-password=${{ steps.ecr.outputs.token }} \
            --namespace=${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy with Helm
        run: |
          helm upgrade --install meteo-app ${{ env.HELM_CHART_DIR }} \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --set global.awsAccountId=${{ steps.aws.outputs.account_id }} \
            --set global.awsRegion=${{ env.AWS_REGION }} \
            --set global.imageTag=${{ github.event.inputs.image_tag || 'latest' }} \
            --set global.ecrToken=${{ steps.ecr.outputs.token }} \
            --wait \
            --timeout 10m

      - name: Verify Deployment
        run: |
          echo "Pods:"
          kubectl get pods -n ${{ env.NAMESPACE }}
          echo ""
          echo "Services:"
          kubectl get svc -n ${{ env.NAMESPACE }}
          echo ""
          echo "Deployments:"
          kubectl get deployments -n ${{ env.NAMESPACE }}

      - name: Get LoadBalancer URL
        id: lb
        run: |
          sleep 30  # Wait for LoadBalancer to be created
          LB_URL=$(kubectl get svc weather-report-service -n ${{ env.NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
          if [ -n "$LB_URL" ]; then
            echo "loadbalancer_url=$LB_URL" >> $GITHUB_OUTPUT
            echo "LoadBalancer URL: http://$LB_URL:8083"
          else
            echo "LoadBalancer still being created..."
          fi

  terraform-destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'destroy'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.13.0'

      - name: Uninstall Helm Release
        run: |
          # Try to configure kubectl and uninstall helm release
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name meteo-cluster || true
          helm uninstall meteo-app -n ${{ env.NAMESPACE }} || true
          kubectl delete namespace ${{ env.NAMESPACE }} || true

      - name: Terraform Init
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform init

      - name: Check Terraform State
        id: check-state
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          RESOURCES=$(terraform state list 2>/dev/null | wc -l || echo "0")
          echo "resources_count=$RESOURCES" >> $GITHUB_OUTPUT
          if [ "$RESOURCES" -eq "0" ]; then
            echo "⚠️  Terraform state is empty. Resources may have been created in a previous run."
            echo "Will attempt manual cleanup..."
          else
            echo "✓ Found $RESOURCES resources in state"
          fi

      - name: Terraform Destroy
        if: steps.check-state.outputs.resources_count != '0'
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform destroy -auto-approve
        env:
          TF_VAR_environment: ${{ github.event.inputs.environment || 'dev' }}

      - name: Manual Cleanup (if state is empty)
        if: steps.check-state.outputs.resources_count == '0'
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          echo "🗑️  Performing manual cleanup of AWS resources..."
          
          CLUSTER_NAME="${{ env.EKS_CLUSTER_NAME }}"
          AWS_REGION="${{ env.AWS_REGION }}"
          
          # 1. Delete EKS Cluster and Node Groups
          echo "1. Checking for EKS clusters..."
          CLUSTERS=$(aws eks list-clusters --region $AWS_REGION --query "clusters[?contains(@, '$CLUSTER_NAME')]" --output text 2>/dev/null || echo "")
          if [ -n "$CLUSTERS" ]; then
            for CLUSTER in $CLUSTERS; do
              echo "   Found cluster: $CLUSTER"
              # Delete node groups
              NODE_GROUPS=$(aws eks list-nodegroups --cluster-name "$CLUSTER" --region $AWS_REGION --query 'nodegroups[*]' --output text 2>/dev/null || echo "")
              for NG in $NODE_GROUPS; do
                echo "   Deleting node group: $NG"
                aws eks delete-nodegroup --cluster-name "$CLUSTER" --nodegroup-name "$NG" --region $AWS_REGION || true
              done
              if [ -n "$NODE_GROUPS" ]; then
                echo "   Waiting for node groups to be deleted (2 minutes)..."
                sleep 120
              fi
              # Delete cluster
              echo "   Deleting cluster: $CLUSTER"
              aws eks delete-cluster --name "$CLUSTER" --region $AWS_REGION || true
            done
          fi
          
          # 2. Delete NAT Gateways
          echo "2. Deleting NAT Gateways..."
          NAT_GWS=$(aws ec2 describe-nat-gateways --region $AWS_REGION --filter "Name=tag:Project,Values=meteo" --query 'NatGateways[?State==`available`].NatGatewayId' --output text 2>/dev/null || echo "")
          for NAT_GW in $NAT_GWS; do
            echo "   Deleting NAT Gateway: $NAT_GW"
            aws ec2 delete-nat-gateway --nat-gateway-id "$NAT_GW" --region $AWS_REGION || true
          done
          if [ -n "$NAT_GWS" ]; then
            echo "   Waiting for NAT Gateways to be deleted (2 minutes)..."
            sleep 120
          fi
          
          # 3. Delete VPCs and associated resources
          echo "3. Deleting VPCs..."
          VPCS=$(aws ec2 describe-vpcs --region $AWS_REGION --filters "Name=tag:Project,Values=meteo" --query 'Vpcs[*].VpcId' --output text 2>/dev/null || echo "")
          for VPC_ID in $VPCS; do
            echo "   Processing VPC: $VPC_ID"
            # Delete subnets
            SUBNETS=$(aws ec2 describe-subnets --region $AWS_REGION --filters "Name=vpc-id,Values=$VPC_ID" --query 'Subnets[*].SubnetId' --output text 2>/dev/null || echo "")
            for SUBNET in $SUBNETS; do
              aws ec2 delete-subnet --subnet-id "$SUBNET" --region $AWS_REGION || true
            done
            # Detach and delete Internet Gateways
            IGW_IDS=$(aws ec2 describe-internet-gateways --region $AWS_REGION --filters "Name=attachment.vpc-id,Values=$VPC_ID" --query 'InternetGateways[*].InternetGatewayId' --output text 2>/dev/null || echo "")
            for IGW_ID in $IGW_IDS; do
              aws ec2 detach-internet-gateway --internet-gateway-id "$IGW_ID" --vpc-id "$VPC_ID" --region $AWS_REGION || true
              aws ec2 delete-internet-gateway --internet-gateway-id "$IGW_ID" --region $AWS_REGION || true
            done
            # Delete route tables (except main)
            RT_IDS=$(aws ec2 describe-route-tables --region $AWS_REGION --filters "Name=vpc-id,Values=$VPC_ID" --query 'RouteTables[?Associations[0].Main==`false`].RouteTableId' --output text 2>/dev/null || echo "")
            for RT_ID in $RT_IDS; do
              aws ec2 delete-route-table --route-table-id "$RT_ID" --region $AWS_REGION || true
            done
            # Delete security groups (except default)
            SG_IDS=$(aws ec2 describe-security-groups --region $AWS_REGION --filters "Name=vpc-id,Values=$VPC_ID" --query 'SecurityGroups[?GroupName!=`default`].GroupId' --output text 2>/dev/null || echo "")
            for SG_ID in $SG_IDS; do
              aws ec2 delete-security-group --group-id "$SG_ID" --region $AWS_REGION || true
            done
            # Delete VPC
            aws ec2 delete-vpc --vpc-id "$VPC_ID" --region $AWS_REGION || true
          done
          
          # 4. Cleanup CloudWatch and KMS
          echo "4. Cleaning up CloudWatch Logs and KMS..."
          aws logs delete-log-group --log-group-name "/aws/eks/$CLUSTER_NAME/cluster" --region $AWS_REGION 2>/dev/null || true
          aws kms delete-alias --alias-name "alias/eks/$CLUSTER_NAME" --region $AWS_REGION 2>/dev/null || true
          
          echo "✅ Manual cleanup completed!"
