{{- if .Values.weatherReportService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-report-service
  namespace: {{ .Values.namespace | default "default" }}
  labels:
    {{- include "meteo-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: weather-report-service
spec:
  replicas: {{ .Values.weatherReportService.replicaCount }}
  selector:
    matchLabels:
      {{- include "meteo-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: weather-report-service
  template:
    metadata:
      labels:
        {{- include "meteo-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: weather-report-service
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: weather-report-service
          image: "{{ .Values.global.awsAccountId }}.dkr.ecr.{{ .Values.global.awsRegion }}.amazonaws.com/{{ .Values.global.ecrRepositoryPrefix }}-weather-report-service:{{ .Values.weatherReportService.image.tag | default .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.weatherReportService.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8083
              protocol: TCP
          env:
            - name: WEATHER_SERVICE_URL
              value: {{ .Values.weatherReportService.environment.weatherServiceUrl | quote }}
            - name: LOCATION_SERVICE_URL
              value: {{ .Values.weatherReportService.environment.locationServiceUrl | quote }}
          livenessProbe:
            httpGet:
              path: /api/report/Paris
              port: http
            initialDelaySeconds: 40
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/report/Paris
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
          resources:
            {{- toYaml .Values.weatherReportService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: weather-report-service
  namespace: {{ .Values.namespace | default "default" }}
  labels:
    {{- include "meteo-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: weather-report-service
  {{- with .Values.weatherReportService.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.weatherReportService.service.type }}
  ports:
    - port: {{ .Values.weatherReportService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "meteo-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: weather-report-service
{{- end }}

