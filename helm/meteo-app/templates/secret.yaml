{{- if .Values.imagePullSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.imagePullSecrets.0.name }}
  namespace: {{ .Values.namespace | default "default" }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ include "imagePullSecret" . }}
---
{{- end }}

{{/*
Generate image pull secret
*/}}
{{- define "imagePullSecret" }}
{{- $registry := printf "%s.dkr.ecr.%s.amazonaws.com" .Values.global.awsAccountId .Values.global.awsRegion }}
{{- $token := required "ECR token is required. Run: aws ecr get-login-password --region <region> | helm upgrade --set global.ecrToken=<token>" .Values.global.ecrToken }}
{{- printf "{\"auths\":{\"%s\":{\"username\":\"AWS\",\"password\":\"%s\"}}}" $registry $token | b64enc }}
{{- end }}

