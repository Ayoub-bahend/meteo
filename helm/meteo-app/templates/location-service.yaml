{{- if .Values.locationService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: location-service
  namespace: {{ .Values.namespace | default "default" }}
  labels:
    {{- include "meteo-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: location-service
spec:
  replicas: {{ .Values.locationService.replicaCount }}
  selector:
    matchLabels:
      {{- include "meteo-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: location-service
  template:
    metadata:
      labels:
        {{- include "meteo-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: location-service
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: location-service
          image: "{{ .Values.global.awsAccountId }}.dkr.ecr.{{ .Values.global.awsRegion }}.amazonaws.com/{{ .Values.global.ecrRepositoryPrefix }}-location-service:{{ .Values.locationService.image.tag | default .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.locationService.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/location/Paris
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/location/Paris
              port: http
            initialDelaySeconds: 20
            periodSeconds: 5
          resources:
            {{- toYaml .Values.locationService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: location-service
  namespace: {{ .Values.namespace | default "default" }}
  labels:
    {{- include "meteo-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: location-service
spec:
  type: {{ .Values.locationService.service.type }}
  ports:
    - port: {{ .Values.locationService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "meteo-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: location-service
{{- end }}

