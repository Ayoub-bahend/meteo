# GitHub Actions Workflow Configuration
# This file references the main workflow file
# The actual workflow is located at: .github/workflows/client.yaml
#
# This workflow will:
# 1. Build Maven projects for each microservice
# 2. Create Docker images for each service
# 3. Push images to AWS ECR
#
# Prerequisites:
# - Set up AWS credentials in GitHub Secrets:
#   - AWS_ACCESS_KEY_ID
#   - AWS_SECRET_ACCESS_KEY
# - Configure AWS_REGION (default: us-east-1)
# - Configure ECR_REPOSITORY_PREFIX (default: meteo)
#
# To use this workflow:
# - Place this file in .github/workflows/client.yaml
# - Or use the existing file at .github/workflows/client.yaml
#
# The workflow automatically:
# - Creates ECR repositories if they don't exist
# - Builds images for all services in parallel using matrix strategy
# - Tags images with commit SHA and 'latest'
# - Pushes to ECR registry

name: Build and Push Docker Images to AWS ECR

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY_PREFIX: meteo

jobs:
  create-ecr-repositories:
    runs-on: ubuntu-latest
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create ECR repositories if they don't exist
        run: |
          aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY_PREFIX }}-weather-service || \
          aws ecr create-repository --repository-name ${{ env.ECR_REPOSITORY_PREFIX }}-weather-service --image-scanning-configuration scanOnPush=true
          
          aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY_PREFIX }}-location-service || \
          aws ecr create-repository --repository-name ${{ env.ECR_REPOSITORY_PREFIX }}-location-service --image-scanning-configuration scanOnPush=true
          
          aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY_PREFIX }}-weather-report-service || \
          aws ecr create-repository --repository-name ${{ env.ECR_REPOSITORY_PREFIX }}-weather-report-service --image-scanning-configuration scanOnPush=true

  build-and-push:
    needs: create-ecr-repositories
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service:
          - weather-service
          - location-service
          - weather-report-service
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Maven project
        working-directory: ${{ github.workspace }}
        run: |
          mvn clean package -DskipTests -pl microservices/${{ matrix.service }} -am

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          SERVICE_NAME: ${{ matrix.service }}
        working-directory: ${{ github.workspace }}
        run: |
          # Build Docker image from project root with service directory as context
          docker build -f microservices/$SERVICE_NAME/Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX-$SERVICE_NAME:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX-$SERVICE_NAME:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX-$SERVICE_NAME:latest
          
          # Push to ECR
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX-$SERVICE_NAME:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX-$SERVICE_NAME:latest
          
          echo "Image URI: $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX-$SERVICE_NAME:$IMAGE_TAG"
          echo "Latest Image URI: $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX-$SERVICE_NAME:latest"

      - name: Output image URIs
        run: |
          echo "Successfully pushed image for ${{ matrix.service }}"
          echo "Repository: $ECR_REPOSITORY_PREFIX-${{ matrix.service }}"
          echo "Tag: ${{ github.sha }}"

