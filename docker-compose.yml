version: '3.8'

services:
  weather-service:
    image: ${ECR_REGISTRY:-864522970972.dkr.ecr.us-east-1.amazonaws.com}/meteo-weather-service:${IMAGE_TAG:-latest}
    container_name: weather-service
    ports:
      - "8081:8081"
    networks:
      - meteo-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8081/api/weather/Paris || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  location-service:
    image: ${ECR_REGISTRY:-864522970972.dkr.ecr.us-east-1.amazonaws.com}/meteo-location-service:${IMAGE_TAG:-latest}
    container_name: location-service
    ports:
      - "8082:8082"
    networks:
      - meteo-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8082/api/location/Paris || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  weather-report-service:
    image: ${ECR_REGISTRY:-864522970972.dkr.ecr.us-east-1.amazonaws.com}/meteo-weather-report-service:${IMAGE_TAG:-latest}
    container_name: weather-report-service
    ports:
      - "8083:8083"
    environment:
      # Utiliser les noms des services Docker Compose pour la communication interne
      - WEATHER_SERVICE_URL=http://weather-service:8081
      - LOCATION_SERVICE_URL=http://location-service:8082
    networks:
      - meteo-network
    depends_on:
      weather-service:
        condition: service_healthy
      location-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8083/api/report/Paris || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  meteo-network:
    driver: bridge

